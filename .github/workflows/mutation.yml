name: mutation-gate

# NON-GOAL: this job NEVER runs on the push path. Mutation runs take 1-2 h;
# a weekly cadence + manual dispatch only. Do not promote it onto commits.
#
# Flow: a `measure` run writes the receipt, uploads it as a workflow
# artifact, and prints the per-module counts in the job summary. A human
# downloads the artifact, reviews the numbers, and commits
# configs/mutation_receipt.json to main via a normal PR — that merge IS the
# act of setting the floors. Weekly `gate` runs then compare fresh
# survived+timeout against the committed receipt and fail on any increase
# (ratchet down only). There is deliberately NO bot commit-back: GITHUB_TOKEN
# cannot create branches containing workflow files, and the human review
# step is mandatory anyway.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "measure (write receipt, exit 0) or gate (fail on survivor increase)"
        type: choice
        options: [measure, gate]
        default: measure
  schedule:
    # Weekly, off the :00 mark (anti-herd).
    - cron: "17 3 * * 1"

permissions: {}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Mutation gate (measure|gate)
        # schedule => gate; manual dispatch => the chosen mode (default measure)
        env:
          GATE_MODE: "${{ github.event_name == 'schedule' && 'gate' || (github.event.inputs.mode || 'measure') }}"
        run: python scripts/mutation_gate.py --mode "${GATE_MODE}"
      - name: Upload receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-receipt
          path: configs/mutation_receipt.json
