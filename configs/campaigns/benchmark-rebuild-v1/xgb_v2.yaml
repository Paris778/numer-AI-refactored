# Campaign benchmark-rebuild-v1 — xgb_v2: linear Pearson screen only.
run:
  name: brb1-xgb-v2
  seed: 20260810

data:
  version: v5.3
  feature_set: all
  feature_subset: screen_stable
  supplemental_feature_sets: artifacts/reports/dataset_analysis/derived_feature_sets.json
  targets:
    - target

split:
  scheme: walk_forward
  purge_eras: 8
  n_folds: 4

model:
  backend: xgboost
  preset: fast
  device: gpu

evaluation:
  backend: custom
  main_target: target
  metrics: [corr, mmc, fnc, sharpe]
  validation_scorecard: true
