# Campaign benchmark-rebuild-v1 — lgbm_v1: full 3,555-feature universe floor.
run:
  name: brb1-lgbm-v1
  seed: 20260810

data:
  version: v5.3
  feature_set: all
  feature_subset: all

  targets:
    - target

split:
  scheme: walk_forward
  purge_eras: 8
  n_folds: 4

model:
  backend: lightgbm
  preset: fast

evaluation:
  backend: custom
  main_target: target
  metrics: [corr, mmc, fnc, sharpe]
  validation_scorecard: true
