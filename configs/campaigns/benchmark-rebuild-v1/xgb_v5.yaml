# Campaign benchmark-rebuild-v1 — xgb_v5: Numerai packaged small set (42).
run:
  name: brb1-xgb-v5
  seed: 20260810

data:
  version: v5.3
  feature_set: all
  feature_subset: small

  targets:
    - target

split:
  scheme: walk_forward
  purge_eras: 8
  n_folds: 4

model:
  backend: xgboost
  preset: fast
  device: gpu

evaluation:
  backend: custom
  main_target: target
  metrics: [corr, mmc, fnc, sharpe]
  validation_scorecard: true
