# Short forced-CUDA calibration for the v5.3 Ender-60 research path.
# This is a smoke/capacity run, not a competitive final candidate.

run:
  name: xgb-gpu-calibration-ender60
  seed: 20260903

data:
  version: v5.3
  feature_set: small
  targets:
    - target_ender_60
  horizon: 60D

split:
  scheme: walk_forward
  purge_eras: 16
  embargo_eras: 0
  n_folds: 2

model:
  backend: xgboost
  preset: fast
  device: gpu
  params:
    n_estimators: 50
    learning_rate: 0.01
    max_depth: 4
    max_leaves: 16
    colsample_bytree: 0.25
    subsample: 0.8

evaluation:
  backend: custom
  main_target: target_ender_60
  payout_policy: classic_atomic_ender60_r1343_v1
  metrics: [corr, mmc, fnc, sharpe]
  validation_scorecard: true

ensemble:
  method: ridge

risk:
  neutralization_proportion: 0.5
