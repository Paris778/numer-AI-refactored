# Capital-path CatBoost on Ender-60 (medium universe).
# Same leakage / payout identity as catboost-quick-ender60, but canonical-fast
# capacity (2000 trees, depth 5) instead of the 300-iteration smoke.
# Train and score the same target. No deploy artifact in this cell.

run:
  name: catboost-ender60-fast
  seed: 20260907

data:
  version: v5.3
  feature_set: medium
  targets:
    - target_ender_60
  horizon: 60D

split:
  scheme: walk_forward
  purge_eras: 16
  embargo_eras: 0
  n_folds: 4

model:
  backend: catboost
  preset: fast
  device: cpu
  params:
    iterations: 2000
    learning_rate: 0.01
    depth: 5
    l2_leaf_reg: 10
    random_strength: 0.5
    bootstrap_type: Bayesian
    bagging_temperature: 0.5
    boosting_type: Ordered
    rsm: 1.0

evaluation:
  backend: custom
  main_target: target_ender_60
  payout_policy: classic_atomic_ender60_r1343_v1
  metrics: [corr, mmc, fnc, sharpe]
  validation_scorecard: true
