# CPU confirmation for xgb-gpu-screen-ender60.yaml.
# Keep model/data/split parameters identical to the screen config; only the
# authoritative full-history validation fit is switched to CPU.

run:
  name: xgb-cpu-confirm-ender60
  seed: 20260904
  workflow: cpu_confirm

data:
  version: v5.3
  feature_set: small
  targets:
    - target_ender_60
  horizon: 60D

split:
  scheme: walk_forward
  purge_eras: 16
  embargo_eras: 0
  n_folds: 4

model:
  backend: xgboost
  preset: fast
  device: gpu
  validation_fit_device: cpu
  deploy_fit_device: cpu
  params:
    n_estimators: 2000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 31
    colsample_bytree: 0.25
    subsample: 0.8
    reg_lambda: 10.0

evaluation:
  backend: custom
  main_target: target_ender_60
  payout_policy: classic_atomic_ender60_r1343_v1
  metrics: [corr, mmc, fnc, sharpe]
  validation_scorecard: true

ensemble:
  method: ridge

risk:
  neutralization_proportion: 1.0
