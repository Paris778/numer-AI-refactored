# Fast GPU screening candidate for the fixed four-target 60D rank ensemble.
# It records OOF research metrics only; CPU confirmation is separate.

run:
  name: xgb-gpu-screen-60d-ensemble
  seed: 20260904
  workflow: gpu_screen

data:
  version: v5.3
  feature_set: small
  targets:
    - target_ender_60
    - target_cyrusd_60
    - target_sam_60
    - target_teager2b_60
  horizon: 60D

split:
  scheme: walk_forward
  purge_eras: 16
  embargo_eras: 0
  n_folds: 4

model:
  backend: xgboost
  preset: fast
  device: gpu
  validation_fit_device: gpu
  deploy_fit_device: cpu
  params:
    n_estimators: 2000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 31
    colsample_bytree: 0.25
    subsample: 0.8
    reg_lambda: 10.0

evaluation:
  backend: custom
  main_target: target_ender_60
  payout_policy: classic_atomic_ender60_r1343_v1
  metrics: [corr, fnc, sharpe]
  validation_scorecard: false

ensemble:
  method: ridge

risk:
  neutralization_proportion: 0.5
